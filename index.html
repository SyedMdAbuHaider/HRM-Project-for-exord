<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Exord HRM">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#E31E24">
    <title>Exord Online - Enterprise HRM</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=Lora:wght@700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --primary: #E31E24;
            --primary-dark: #C41217;
            --slate-dark: #0f172a;
            /* Safe-area support for notched iPhones */
            --safe-top:    env(safe-area-inset-top,    0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left:   env(safe-area-inset-left,   0px);
            --safe-right:  env(safe-area-inset-right,  0px);
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Allow text selection in inputs/textareas */
        input, textarea, [contenteditable] {
            -webkit-user-select: text;
            user-select: text;
        }
        /* Remove iOS input shadow */
        input, textarea, select {
            -webkit-appearance: none;
        }
        /* Remove tap highlight flash on mobile */
        * { -webkit-tap-highlight-color: transparent; }
        /* Smooth scrolling inside panels */
        .scroll-area {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .leaflet-container {
            height: 100%;
            width: 100%;
            border-radius: 2.5rem;
            z-index: 1;
            filter: grayscale(0.1) contrast(1.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scanLine {
            0%   { top: 10%; }
            50%  { top: 85%; }
            100% { top: 10%; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.1); border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #E31E244D; }

        /* Smooth momentum scrolling on iOS */
        .custom-scrollbar { -webkit-overflow-scrolling: touch; }

        input:focus { outline: none; }

        .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04), 0 20px 25px -5px rgba(0, 0, 0, 0.02);
        }

        .dark .soft-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5), 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Remove tap highlight flash on mobile */
        button, a { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="custom-scrollbar selection:bg-red-100 selection:text-red-600 bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <!-- ✅ THIS IS THE CRITICAL LINE — Vite entry point -->
    <script type="module" src="/index.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (reg) {
              console.log('[Exord SW] Registered. Scope:', reg.scope);
              navigator.serviceWorker.addEventListener('message', function (event) {
                if (event.data && event.data.type === 'NAVIGATE') {
                  window.dispatchEvent(
                    new CustomEvent('exord-navigate', { detail: event.data.view })
                  );
                }
              });
            })
            .catch(function (err) {
              console.warn('[Exord SW] Registration failed:', err);
            });
        });
      }
    </script>
</body>
</html>
