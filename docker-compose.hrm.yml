services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: exord_hrm
      POSTGRES_USER: exord_hrm
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - hrm_postgres:/var/lib/postgresql/data
    networks: [hrm_private]
    expose: ["5432"]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hrm_redis:/data
    networks: [hrm_private]
    expose: ["6379"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    networks: [hrm_private]
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  hrm_postgres:
  hrm_redis:

networks:
  hrm_private:
    driver: bridge
